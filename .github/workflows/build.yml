name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Insert API key
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: sed -i "s|__GEMINI_KEY__|$GEMINI_KEY|" core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/services/ai/GeminiChatService.java
      - run: chmod +x gradlew && ./gradlew android:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: spd-ghost-ai-apk
          path: android/build/outputs/apk/debug/*.apk
